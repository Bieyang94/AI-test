version: "3.8"

services:
  ai-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-test-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    volumes:
      - upload_data:/app/app/service/server/upload_files
      - cache_data:/app/app/service/server/cache
      - debug_output:/app/app/service/server/debug_output
    restart: unless-stopped

volumes:
  upload_data:
  cache_data:
  debug_output:
